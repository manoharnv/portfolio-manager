#!/usr/sbin/nft -f
#
# infra/vm/nftables-strategy-egress.conf — docs/01 §1.5 ("the egress
# allowlist is a real security control"), docs/05 §5.1, docs/08 §8.2.
#
# Scope: ONLY the `pm-strategy` OS user's outbound traffic. Every other
# process on the box (pm-backend, caddy, sshd, root) — and every packet the
# kernel generates on its own — is untouched by this table.
#
# What this does and does NOT guarantee (be honest about this in
# infra/README.md too): order endpoints and read/data endpoints for BOTH
# Dhan and Kite live on the SAME hostnames (`api.dhan.co`, `api.kite.trade`)
# used for reads and quotes. This firewall enforces *hosts*, not *paths* —
# it cannot tell "GET holdings" from "POST place order" inside the same TLS
# connection to the same IP. The guarantee that the strategy process never
# calls an order *endpoint* comes from the code/lint/policy layers (docs/05
# §5.1: apps/strategy only ever imports `BrokerReadAdapter`/
# `createReadAdapter`, which has no order methods at runtime; enforced by
# eslint.config.js + policy.test.ts), not from this file. What THIS file
# guarantees is narrower but still real: pm-strategy cannot OPEN a connection
# to ANY host outside this fixed list — including a completely different,
# unlisted attacker-controlled exfiltration endpoint, or a broker order
# endpoint on a *different* hostname than the read one.
#
# Installed to /etc/nftables-strategy-egress.conf by bootstrap.sh and loaded
# with `nft -f`. Idempotent: the add/delete/add table dance below makes this
# file safe to re-run on every deploy (infra/scripts/deploy.sh) without
# manual flushing first — see the Arch/nftables-wiki idiom this follows.
# Re-loading EMPTIES the sets; bootstrap.sh restarts pm-egress-allowlist
# right after so they are repopulated (and the /etc/hosts pins refreshed).
#
# The two named sets below start EMPTY. infra/vm/egress-allowlist.sh (run
# once at boot by pm-egress-allowlist.service, then every 10 minutes by
# pm-egress-allowlist.timer) resolves the allowlisted hostnames to IPs,
# populates them, and pins each hostname in /etc/hosts to one of those
# addresses. Until the first successful run, pm-strategy has NO egress at all
# beyond loopback/DNS/metadata — fail closed (docs/00 §0.7), not fail open.
#
# Two lessons from the live VM (docs/11 §11.6 #15):
#   - `meta skuid` does not match a packet that has no socket — the RST/ACK
#     the kernel emits for a stale or port-scanned connection. The original
#     `meta skuid != "pm-strategy" accept` therefore let those fall through
#     to the final drop: log noise attributed to the engine, and peers left
#     to time out. The chain now matches pm-strategy POSITIVELY and jumps.
#   - A refresh replaces the sets with the CDN's answers of the moment; a
#     connection the engine opened ten minutes earlier — a keep-alive HTTPS
#     socket, a Firestore gRPC channel — was suddenly to an address no longer
#     in the set and died mid-request ("fetch failed"). Established
#     connections are therefore accepted: the control is on OPENING one.

add table inet pm_filter
delete table inet pm_filter
add table inet pm_filter

table inet pm_filter {
	# Resolved-IP allowlist for the strategy user's HTTPS egress. Populated
	# by egress-allowlist.sh, never edited here by hand. `flags interval`
	# lets the refresh script add either single addresses or CIDR ranges
	# without changing the set's type later.
	set strategy_allowed_v4 {
		type ipv4_addr
		flags interval
	}

	set strategy_allowed_v6 {
		type ipv6_addr
		flags interval
	}

	chain output {
		type filter hook output priority 0; policy accept;

		# Only packets belonging to a socket owned by pm-strategy are
		# inspected; everything else (other users, socketless kernel
		# packets) is accepted by the chain policy.
		meta skuid "pm-strategy" jump strategy_egress
	}

	chain strategy_egress {
		# A connection this user was allowed to open stays usable across
		# set refreshes — see the header. New connections are decided below.
		ct state established,related accept

		# Loopback (health checks, local resolver stub, etc).
		oif "lo" accept

		# DNS — needed both for normal libc resolution and so this same
		# allowlist can keep re-resolving its own hostnames.
		udp dport 53 accept
		tcp dport 53 accept

		# GCE metadata server for Application Default Credentials token
		# fetches (used by @google-cloud/secret-manager and
		# firebase-admin). Hardcoded IP, not just the DNS name, because
		# ADC token fetches are on the hot path for every Firestore/Secret
		# Manager call and must not depend on this ruleset's dynamic set
		# being freshly populated.
		ip daddr 169.254.169.254 tcp dport 80 accept

		# The actual allowlist: broker read/data + Firestore + Secret
		# Manager + oauth2, HTTPS only. See egress-allowlist.sh for the
		# exact hostname list (api.dhan.co, api.kite.trade,
		# firestore.googleapis.com, secretmanager.googleapis.com,
		# oauth2.googleapis.com, metadata.google.internal).
		tcp dport 443 ip daddr @strategy_allowed_v4 accept
		tcp dport 443 ip6 daddr @strategy_allowed_v6 accept

		# Everything else this user tries to OPEN: logged, then dropped.
		log prefix "pm-strategy-egress-drop: " drop
	}
}
