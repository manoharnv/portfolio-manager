packages:
  - 'packages/*'
  - 'apps/*'
  - 'functions'

# pnpm 10+ refuses to run dependency postinstall scripts unless allowed here.
# Everything below only places native/prebuilt binaries. Keep minimal and reviewed.
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  esbuild: true
  protobufjs: true
  unrs-resolver: true
